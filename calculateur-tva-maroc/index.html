<h1>Calculateur TVA Maroc</h1>
<label>Montant <input id="m" type="number" value="1000"></label>
<label>Taux <select id="t"><option>20</option><option>14</option><option>10</option><option>7</option></select></label>
<label><select id="s"><option value="ht">HT → TTC</option><option value="ttc">TTC → HT</option></select></label>
