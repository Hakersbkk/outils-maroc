</style></head><body><div class="wrap">

<main>
<h1>Coût carburant de votre trajet</h1>
<label>Distance (km) <input id="d" type="number" value="100"></label>
<label>Consommation (L/100km) <input id="c" type="number" value="6" step="0.1"></label>
<label>Prix du carburant (DH/L) <input id="p" type="number" value="14.50" step="0.01"></label>
<label>Aller-retour ? <select id="r"><option value="1">Oui</option><option value="0">Non</option></select></label>
<button onclick="calc()">Calculer</button><div class="out" id="r"></div>
<script>function calc(){const d=+document.getElementById('d').value||0,c=+document.getElementById('c').value||0,pp=+document.getElementById('p').value||0,ar=+document.getElementById('r').value;
const dist=d*(ar?2:1),l=dist*c/100,cost=l*pp;
document.getElementById('r').innerHTML=`Distance totale : <b>${dist} km</b> · Carburant : <b>${l.toFixed(1)} L</b><br>Coût : <b>${cost.toFixed(0)} DH</b> (à ${pp} DH/L — prix indicatif, ajustez selon le prix du jour).`;}</script>
