<h1>Calculateur d'âge</h1>
<label>Date de naissance <input id="d" type="date"></label>
<button onclick="calc()">Calculer</button><div id="r"></div>
<script>function calc(){const v=document.getElementById('d').value;if(!v)return;const b=new Date(v),n=new Date();
let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();
if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}
if(m<0){y--;m+=12}
const days=Math.floor((n-b)/86400000);
document.getElementById('r').innerHTML=`<b>${y} ans, ${m} mois, ${d} jours</b><br>Soit environ <b>${days.toLocaleString('fr-FR')}</b> jours vécus 🎉`;}</script>
