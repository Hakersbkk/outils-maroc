<main>
<h1>Simulateur de mensualité de crédit</h1>
<label>Montant (DH) <input id="p" type="number" value="100000"></label>
<label>Taux annuel % <input id="r" type="number" value="6" step="0.1"></label>
<label>Durée (mois) <input id="n" type="number" value="48"></label>
<button onclick="calc()">Calculer</button><div id="r"></div>
<script>function calc(){const P=+document.getElementById('p').value||0,i=(+document.getElementById('r').value||0)/1200,n=+document.getElementById('n').value||1;
const m=P?P*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):0;
document.getElementById('r').innerHTML=`Mensualité : <b>${m.toFixed(0)} DH</b><br>Coût total du crédit : <b>${(m*n-P).toFixed(0)} DH</b> (hors frais de dossier et assurance)·<small>estimation</small>`;}</script>
