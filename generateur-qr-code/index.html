<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de QR code gratuit (lien, wifi, texte)</title><meta name="description" content="Créez un QR code pour un lien ou un texte. Généré sur votre appareil.">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#16202b;background:#f6f5f1;line-height:1.65}
.wrap{max-width:760px;margin:0 auto;padding:22px}header a{font-weight:800;text-decoration:none;color:#16202b}
header span{color:#e2552b}main{background:#fff;border:1px solid #e6e2d9;border-radius:14px;padding:26px;margin:16px 0}
h1{font-size:1.7rem;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
h2{font-size:1.2rem;margin:20px 0 8px}p,li{color:#3c4650}ul,ol{padding-left:20px;margin:8px 0}
label{display:block;margin:10px 0;font-size:.95rem}input,textarea,select{width:100%;padding:10px;font:inherit;border:1px solid #cfcbc0;border-radius:8px;margin-top:4px}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:8px;background:#e2552b;color:#fff;cursor:pointer;margin-top:10px}
#r,.out{margin-top:14px;padding:12px;background:#faf8f2;border:1px solid #e9e5da;border-radius:8px}
textarea{resize:vertical}footer{color:#667380;font-size:.85rem;padding:18px 0 40px;text-align:center}
.disc{font-size:.85rem;color:#667380;border-top:1px dashed #ddd;margin-top:22px;padding-top:10px}
</style></head><body><div class="wrap">
<header><a href="/">Outils<span>.</span>ma</a> — outils gratuits pour le Maroc</header>
<main>
<h1>Générateur de QR code</h1>
<input id="t" placeholder="https://exemple.com ou n'importe quel texte" style="width:100%">
<button onclick="qr()">Créer le QR code</button><div id="r"></div>
<script>function qr(){const t=document.getElementById('t').value.trim();if(!t)return;
document.getElementById('r').innerHTML='<img alt="QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(t)+'">';}</script>

</main>
<footer>© Outils.ma — outils et calculateurs gratuits · <a href="/">tous les outils</a></footer>
</div></body></html>
