<label>Salaire brut mensuel (DH) <input id="b" type="number" value="8000"></label>
<button onclick="calc()">Estimer</button><div id="r"></div>
<script>
function ir(annuel){const t=[[0,.0],[30000,.1],[50000,.2],[60000,.3],[80000,.34],[180000,.38]];
let imp=0;for(let i=1;i<t.length;i++){if(annuel>t[i][0])imp+=(Math.min(annuel,t[i+1]?.[0]??annuel)-t[i][0])*t[i][1]}return imp}
function calc(){const b=+document.getElementById('b').value||0;
const cnss=b*.0448,amo=b*.02,ni=b-cnss-amo;const imp=ir(ni*12)/12;
const net=ni-imp;
document.getElementById('r').innerHTML=`CNSS (4,48%) : ${cnss.toFixed(0)} DH<br>AMO (2%) : ${amo.toFixed(0)} DH<br>IR estimé : ${imp.toFixed(0)} DH<br><b>Net estimé : ${net.toFixed(0)} DH / mois</b>`;}</script>
